<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo3_RW8_icon.ico' %}" sizes="128x128" class="favicon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background-color: #d8c2b0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 15px;
            margin: 0;
        }

        .reset-wrapper {
            display: flex;
            flex-direction: row;
            background-color: #ffffff;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .reset-image-container {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .reset-image {
            max-width: 100%;
            height: auto;
        }

        .reset-container {
            padding: 30px;
            text-align: center;
            width: 60%;
        }

        h1 {
            color: #5b3e31;
            margin-bottom: 10px;
            font-size: 22px;
        }

        p {
            color: #755F51;
            font-size: 14px;
            margin: 10px 0;
        }

        .email-input-container {
            margin: 20px 0;
        }

        .email-input {
            width: 100%;
            height: 45px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #7a6253;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .email-input:focus {
            border-color: #110808;
        }

        .submit-btn {
            background-color: #5b3e31;
            width: 100%;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #56463b;
        }

        .options {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .options a {
            color: #56463b;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .reset-wrapper {
                flex-direction: column;
                align-items: center;
                text-align: center;
                width: 100%;
                max-width: 400px;
            }

            .reset-image-container {
                width: 100%;
                padding: 20px 20px 0px 20px;
            }

            .reset-image {
                height: 220px;
                width: 270px;

            }

            .reset-container {
                width: 100%;
                padding: 20px;
            }

            .email-input {
                font-size: 14px;
                height: 40px;
                width: 80%;
            }

            .submit-btn {
                width: 90%;
            }
        }


        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1;
            /* Sit on top */
            top: 20px;
            right: 20px;
            width: auto;
            height: auto;
            background-color: transparent;
            /* No background for the overall modal */
        }

        /* Modal Content/Box */
        .modal-content {
            background-color: white;
            /* Red background for error */
            /* padding: 15px 20px; */
            border-radius: 10px;
            width: 230px;
            box-shadow: 10px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-content p {
            color: red;
            padding-top: 10%;
            padding-left: 2%;
            font-size: 15px;
        }

        /* The Close Button */
        .close {
            margin-left: auto;
            margin-bottom: auto;
            /* Push to the right */
            padding-right: 5%;
            color: #5b3e31;
            font-size: 22px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }

        close:hover,
        .close:focus {
            color: #333;
            text-decoration: none;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .modal {
                height: 60%;
            }

            .modal-content {
                width: 90%;
                height: 15%;
                /* Full width on smaller screens */
                right: 5%;
            }
        }

        .modal-content i {
            color: red;
            font-size: 20px;
            padding-left: 5%;
        }
    </style>
</head>

<body>

    <div id="reset" class="modal">
        <div class="modal-content">
            <i class="fa fa-exclamation-triangle"></i>
            <p id="message_reset"></p>
            <span class="close">&times;</span>
        </div>

    </div>

    <div class="reset-wrapper">
        <div class="reset-image-container">
            <img class="reset-image" src="{% static 'images/mail.png' %}" alt="Reset Password Illustration">
        </div>
        <div class="reset-container">
            <h1>Reset Password</h1>
            <p>Please enter your email so that we can send you a reset password link.</p>
            <form action="" method="POST" id="email">
                {% csrf_token %}
                <div class="email-input-container">
                    <input type="email" name="email" class="email-input" placeholder="Enter your email" id="email1">
                </div>
                <button type="submit" class="submit-btn">Send Reset Link</button>
            </form>
        </div>
    </div>

    <script>
        debugger;
        const resetform = document.getElementById("email");

        const modal = document.getElementById("reset");
        const span = document.querySelector(".close");
        const message = document.getElementById("message_reset");

        resetform.addEventListener("submit", (event) => {
            event.preventDefault();

            const email = document.getElementById("email1");

            const regExEmail = /^[a-zA-Z0-9_.+\-]+@([a-zA-Z0-9.\-]+\.)+[a-zA-Z]{2,}$/;


            let valid = true;
            resetErrorMessages();


            if (email.value === "") {
                valid = false;
                showModal("Email is required.", "error");
            } else if (!regExEmail.test(email.value)) {
                valid = false;
                showModal("Enter a valid email address.", "error");
            }

            if (valid) {
                const resetformData = new FormData(resetform); // Use the correct FormData object
                const resetUrl = window.location.origin + "/Account/forgot_password/";
                fetch(resetUrl, {
                    method: 'POST',
                    body: resetformData, // Correct FormData object used here
                })
                    .then(response => response.url)
                    .then(url => {
                        const params = new URLSearchParams(url.split('?')[1]);
                        const error = params.get('error');
                        const success = params.get('success');
                        if (error) {
                            // document.getElementById('error-message').value = error;
                            showModal(error);
                            // Displaying alert message instead of error in the HTML
                            // alert(error); // This will show an alert with the error message
                        }
                        if (success) {
                            showModal(success);
                            window.location.href = window.location.origin + "Account/login/"; // Redirect if login is successful

                        }
                    });
            }
        });



        function showModal(messageText, type) {
            message.textContent = messageText;

            const icon = document.querySelector(".modal-content i"); // Get the icon element

            if (type == "error") {
                message.style.color = "red";
                icon.className = "fa fa-exclamation-triangle"; // Set error icon
                icon.style.color = "red";
            } else {
                message.style.color = "green";
                icon.className = "fa fa-check-circle"; // Set success icon
                icon.style.color = "green";
            }

            modal.style.display = "block";

            setTimeout(() => {
                modal.style.display = "none";
            }, 7000);
        }


        function resetErrorMessages() {
            const errorMsg = document.querySelectorAll(".error-message");
            errorMsg.forEach((error) => {
                error.textContent = "";
            });
        }


        span.onclick = function () {
            modal.style.display = "none";
        };

        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    </script>

</body>

</html>

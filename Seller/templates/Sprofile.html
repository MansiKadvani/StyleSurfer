{% extends 'base_seller.html' %}
{% load static %}

{% block title %} Seller - Profile {% endblock %}

{% block css %}
<style>
    .container{
        color: #2a1b10;
    }
    hr{
        background-color: #3b2415;
        height: 2px;
    }
    .form-control:enabled{
        background-color: white!important;
        border: 2px solid #3b2415;
    }
    .form-control:disabled{
        background-color: white!important;
        box-shadow: 0px 2px 10px rgb(201, 194, 194);
        border: 1px solid #3b2415;
    }
    .btn-dark:disabled{
        background-color: #593e2d;
        color: white;
    }
    .btn-dark:disabled{
        background-color: #3b2415;
        color: white;
    }
    .btn-primary{
        background-color: #3b2415;
        border: 1px solid #3b2415;
    }
</style>
{% endblock %}
{% block body %}

<div class="container mt-5">
    <!-- Profile Header -->
    <div class="profile-header text-center">
        <h3 class="mt-2">{{ Suser.sname }}</h3>
        <p>You can view and edit your profile.</p>
    </div>
    <hr><hr>
    <!-- Profile Details -->
    <form method="POST" class="mt-4" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <!-- Name Field -->
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="sname" value="{{ Suser.sname }}" disabled>
            </div>

            <!-- Email Field -->
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="semail" value="{{ Suser.semail }}" disabled>
            </div>

            <!-- Mobile Number Field -->
            <div class="col-md-6 mb-3">
                <label for="mobile" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="mobile" name="snumber" value="{{ Suser.snumber }}" disabled>
            </div>

            <!-- Address Field -->
            <div class="col-md-12 mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="saddress" rows="3" disabled>{{ Suser.saddress }}</textarea>
            </div>
        </div>

        <!-- Edit and Save Buttons -->
        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-dark" id="saveBtn" disabled>Save</button>
           
        </div>
        <button type="button" class="btn btn-primary me-2" onclick="enableEditing()">Edit</button>
        <button type="button" class="btn btn-dark ms-2" onclick="disableEditing()" id="cancelBtn" style="display: none;">Cancel</button>
        <a href="{% url 'Saccount' %}" class="btn btn-secondary ms-2">Back</a>
    </form>
   
</div>

{% endblock %}

{% block js %}
<script>
    function validateForm() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const mobile = document.getElementById('mobile').value.trim();
        const address = document.getElementById('address').value.trim();

        // Basic validation rules
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const mobileRegex = /^\d{10}$/;

        if (name === '' || email === '' || mobile === '' || address === '') {
            return false;
        }

        if (!emailRegex.test(email)) {
            return false;
        }

        if (!mobileRegex.test(mobile)) {
            return false;
        }

        return true;
    }

    function enableEditing() {
        const inputs = document.querySelectorAll("input, textarea");
        inputs.forEach(input => {
            if (input.id !== "password") {
                input.disabled = false;
                input.addEventListener('input', checkFormValidity);
            }
        });
        document.getElementById("saveBtn").style.display = "inline-block";
        document.getElementById("saveBtn").disabled = true;
        document.getElementById("cancelBtn").style.display = "inline-block";
    }

    function disableEditing() {
        const inputs = document.querySelectorAll("input, textarea");
        inputs.forEach(input => {
            input.disabled = true;
            input.removeEventListener('input', checkFormValidity);
        });
        document.getElementById("saveBtn").disabled = true;
        document.getElementById("cancelBtn").style.display = "none";
    }

    function checkFormValidity() {
        const saveBtn = document.getElementById("saveBtn");
        if (validateForm()) {
            saveBtn.disabled = false;
        } else {
            saveBtn.disabled = true;
        }
    }

    // Automatically enable editing when the form is shown
    document.addEventListener('DOMContentLoaded', function() {
        // Enable or disable editing based on whether the user is editing or viewing
        if (document.querySelector('input:disabled')) {
            disableEditing();
        } else {
            enableEditing();
        }
    });

</script>
{% endblock %}

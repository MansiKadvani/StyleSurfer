<!DOCTYPE html>
<html>
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo3_RW8_icon.ico' %}" sizes="128x128" class="favicon">


    <!-- MATERIAL DESIGN ICONIC FONT -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'fonts/material-design-iconic-font/css/material-design-iconic-font.css' %}">

    <!-- STYLE CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <style>
        .wrapper {
            background-color: #d8c2b0;
        }

        .container {
            animation: fadeIn 0.5s ease-in;
        }

        .inner {
            border-radius: 10px;
            border: none;
            box-shadow: 17px 17px 5px 5px #1108087c;
            /* Softer shadow for depth */
            transition: transform 0.3s ease;
        }

        .image-holder img {
            width: 100%;
            height: 100%;
        }

        button {
            background-color: #5b3e31;
            padding: 10px;
            display: block;
            margin: auto;
            margin-top: 25px;
            margin-bottom: 21px;
            width: 100%;

        }



        .inner:hover {
            transform: translateY(-5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1;
            /* Sit on top */
            top: 20px;
            right: 20px;
            width: auto;
            height: auto;
            background-color: transparent;
            /* No background for the overall modal */
        }

        /* Modal Content/Box */
        .modal-content {
            background-color: white;
            /* Red background for error */
            /* padding: 15px 20px; */
            border-radius: 10px;
            width: 230px;
            box-shadow: 10px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-content p {
            color: red;
            padding-top: 10%;
            padding-left: 2%;
            font-size: 15px;
        }

        /* The Close Button */
        .close {
            margin-left: auto;
            margin-bottom: auto;
            /* Push to the right */
            padding-right: 5%;
            color: #5b3e31;
            font-size: 22px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }

        close:hover,
        .close:focus {
            color: #333;
            text-decoration: none;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .modal {
                height: 60%;
            }

            .modal-content {
                width: 90%;
                height: 15%;
                /* Full width on smaller screens */
                right: 5%;
            }
        }

        .modal-content i {
            color: red;
            font-size: 20px;
            padding-left: 5%;
        }

        .forgot {
            font-size: 15px;
            text-align: left;
            margin-bottom: 5px;
            margin-top: 10px;
            padding-bottom: 5px;
        }

        .fa-eye-slash , .fa-eye{
            color: #5b3e31;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="wrapper">
            <div id="forgot" class="modal">
                <div class="modal-content">
                    <i class="fa fa-exclamation-triangle"></i>
                    <p id="message_forgot"></p>
                    <span class="close">&times;</span>
                </div>

            </div>
            <form action="" method="POST" id="wizard">
                {% csrf_token %}
                <div class="inner">
                    <div class="image-holder">
                        <img src="{% static 'images/login.jpg' %}" alt="">
                    </div>
                    <div class="form-content">
                        <div class="form-header">
                            <h3 style="color: #5b3e31;">Change Password</h3>
                        </div>
                        <div class="form-row">
                            <div class="form-holder w-100">
                                <input type="password" name="password" id="password" placeholder="Password"
                                    class="form-control">
                                <i class="fa fa-eye-slash toggle-password" id="togglePassword1"
                                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;"></i>

                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-holder w-100">
                                <input type="password" placeholder="Confirm Password" name="confirm_password"
                                    id="confirm_password" class="form-control">
                                <i class="fa fa-eye-slash toggle-password" id="togglePassword1"
                                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;"></i>

                            </div>
                        </div>
                        <p class="forgot"><a href="{% url 'login' %}"><u>Back</u></a></p>
                        <button type="submit" id="submit">Change Password</button>
                    </div>

                </div>
            </form>
        </div>
    </div>


    <script>

        document.getElementById('togglePassword1').addEventListener('click', function () {
            const passwordField = document.getElementById('password');
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            this.classList.toggle('fa-eye'); // Toggle icon
        });

        const forgot1 = document.getElementById("wizard");

        const modal = document.getElementById("forgot");
        const span = document.querySelector(".close");
        const message = document.getElementById("message_forgot");

        forgot1.addEventListener("submit", (event) => {
            event.preventDefault();

            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirm_password");

            const regExPassword = /^(?=.*[A-Z])(?=.*[!@#$%^&*()_+{}\[\]:;"'<>,.?~-])[A-Za-z\d!@#$%^&*()_+{}\[\]:;"'<>,.?~-]{8,}$/;

            let valid = true;
            resetErrorMessages();

            if (password.value === "") {
                valid = false;
                showModal("Password is required.");
            } else if (!regExPassword.test(password.value)) {
                valid = false;
                showModal("Password must be at least 8 characters long and include at least one uppercase letter and one special character.");
            } else if (confirmPassword.value === "") {
                valid = false;
                showModal("Confirm password is required.");
            } else if (confirmPassword.value !== password.value) {
                valid = false;
                showModal("Passwords do not match.");
            }

            debugger;
            if (valid) {
                const ForgotformData = new FormData(forgot1); // Use the correct FormData object
                const token = "{{ token }}";
                const forgotUrl = `${window.location.origin}/Account/reset_password/${token}/`;
                fetch(forgotUrl, {
                    method: 'POST',
                    body: ForgotformData, // Correct FormData object used here
                })
                    .then(response => response.url)
                    .then(url => {
                        const params = new URLSearchParams(url.split('?')[1]);
                        const error = params.get('error');
                        if (error) {
                            // document.getElementById('error-message').value = error;
                            showModal(error);
                            // Displaying alert message instead of error in the HTML
                            // alert(error); // This will show an alert with the error message
                        } else {
                            window.location.href = `${window.location.origin}/Account/login?success=Password reset successfully!You can now log in.`; // Redirect if login is successful
                        }
                    });
            }


        });

        function showModal(messageText) {
            message.textContent = messageText;
            modal.style.display = "block";

            setTimeout(() => {
                modal.style.display = "none";
            }, 7000); // 3000 milliseconds = 3 seconds

        }

        function resetErrorMessages() {
            const errorMsg = document.querySelectorAll(".error-message");
            errorMsg.forEach((error) => {
                error.textContent = "";
            });
        }


        span.onclick = function () {
            modal.style.display = "none";
        };

        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    </script>
    <!-- JQUERY STEP -->

    <!-- Template created and distributed by Colorlib -->

</body>

</html>

<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP - SetPSW</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo3_RW8_icon.ico' %}" sizes="128x128" class="favicon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }

        .container {
            display: flex;
            flex-direction: row;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 3px 13px #3b2415;
            overflow: hidden;
            width: 800px;
            max-width: 95%;
        }

        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex: 1;
        }

        .image-section img {
            max-width: 100%;
            height: auto;
            max-height: 250px;
        }

        .form-section {
            flex: 1;
            padding: 40px 30px;
            text-align: center;
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #3b2415;
        }

        .form-section form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-section input[type="password"] {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #5b3e31;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-section input[type="password"]:focus {
            border: 2px solid #3b2415;
            outline: none;
        }

        .form-section button {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            background-color: #3b2415;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .form-section button:hover {
            background-color: #5b3e31;
        }

        .modal1 {
            display: none;
            position: fixed;
            z-index: 1;
            top: 20px;
            right: 20px;
            background-color: transparent;
        }

        .modal-content1 {
            background-color: white;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }

        .modal-content1 p {
            color: red;
            font-size: 14px;
        }

        .close {
            margin-left: auto;
            color: #5b3e31;
            font-size: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background: none;
        }

        .close:hover {
            color: #333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .image-section {
                padding: 10px;
            }

            .image-section img {
                max-height: 200px;
            }

            .form-section {
                padding: 20px;
            }

            .form-section input[type="password"],
            .form-section button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .modal1 {
                top: 10px;
                right: 10px;
                width: 90%;
            }

            .modal-content1 {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="psw" class="modal1">
        <div class="modal-content1">
            <i class="fa fa-exclamation-triangle"></i>
            <p id="messages"></p>
            <span class="close">&times;</span>
        </div>
    </div>

    <div class="container">
        <div class="image-section">
            <img src="{% static 'images/psw.png' %}" alt="Secure Password">
        </div>
        <div class="form-section">
            <h2>Set Your Password</h2>
            <form action="/set_password" method="POST" id="pswForm">
                {% csrf_token %}
                <input type="hidden" name="email" value="{{ email }}">
                <input type="password" id="password" name="password" placeholder="New Password">
                <input type="password" name="cpassword" id="cpassword" placeholder="Confirm Password">
                <button type="submit">Set Password</button>
            </form>
        </div>
    </div>

    <script>
        const setPSW = document.getElementById("pswForm");
        const modal = document.getElementById("psw");
        const span = document.querySelector(".close");
        const message = document.getElementById("messages");

        setPSW.addEventListener("submit", (event) => {
            event.preventDefault();

            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("cpassword").value;
            const regExPassword = /^(?=.*[A-Z])(?=.*[!@#$%^&*()_+{}\[\]:;"'<>,.?~-])[A-Za-z\d!@#$%^&*()_+{}\[\]:;"'<>,.?~-]{8,}$/;

            if (password === "") {
                showModal("Password is required.");
            } else if (!regExPassword.test(password)) {
                showModal("Password must be at least 8 characters long and include at least one uppercase letter and one special character.");
            } else if (confirmPassword === "") {
                showModal("Confirm password is required.");
            } else if (confirmPassword !== password) {
                showModal("Passwords do not match.");
            } else {
                fetch(`${window.location.origin}/DP/Dset_password/`, {
                    method: 'POST',
                    body: new FormData(setPSW),
                })
                .then(response => response.url)
                .then(url => {
                    const params = new URLSearchParams(url.split('?')[1]);
                    const error = params.get('error');
                    if (error) {
                        showModal(error);
                    } else {
                        window.location.href = `${window.location.origin}/DP/DP_login?success=password_set`;
                    }
                });
            }
        });

        span.onclick = function () {
            modal.style.display = "none";
        };

        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };

        function showModal(messageText) {
            message.textContent = messageText;
            modal.style.display = "block";
            setTimeout(() => {
                modal.style.display = "none";
            }, 5000);
        }
        
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo3_RW8_icon.ico' %}" sizes="128x128" class="favicon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 3px 13px #3b2415;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
        }

        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex: 1;
            max-width: 400px;
        }

        .image-section img {
            max-width: 100%;
            height: auto;
        }

        .form-section {
            flex: 1;
            padding: 20px;
            text-align: center;
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #3b2415;
            font-size: 24px;
        }

        .form-section form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-section input[type="password"] {
            width: 90%;
            max-width: 300px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #5b3e31;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-section input[type="password"]:focus {
            border: 2px solid #3b2415;
            outline: none;
        }

        .form-section button {
            width: 90%;
            max-width: 300px;
            padding: 10px;
            background-color: #3b2415;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .form-section button:hover {
            background-color: #5b3e31;
        }

        .change {
            text-align: end;
            width: 100%;
        }

        p {
            font-size: 16px;
        }

        p a {
            text-decoration: none;
            color: #3b2415;
            opacity: 60%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            top: 20px;
            right: 20px;
            width: auto;
            height: auto;
            background-color: transparent;
        }

        .modal-content {
            background-color: white;
            border-radius: 10px;
            width: 230px;
            box-shadow: 10px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-content p {
            color: red;
            padding-top: 10%;
            padding-left: 2%;
            font-size: 15px;
        }

        .close {
            margin-left: auto;
            margin-bottom: auto;
            padding-right: 5%;
            color: #5b3e31;
            font-size: 22px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }

        close:hover,
        .close:focus {
            color: #333;
            text-decoration: none;
        }

        .modal-content i {
            color: red;
            font-size: 20px;
            padding-left: 5%;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .form-section {
                padding: 20px;
            }

            .form-section h2 {
                font-size: 20px;
            }

            .form-section input[type="password"],
            .form-section button {
                width: 100%;
            }

            p {
                font-size: 14px;
            }

            .image-section {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                box-shadow: 0 2px 8px #3b2415;
            }

            .form-section h2 {
                font-size: 18px;
            }

            .form-section input[type="password"],
            .form-section button {
                font-size: 14px;
                padding: 8px;
            }

            p a {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="psw" class="modal">
        <div class="modal-content">
            <i class="fa fa-exclamation-triangle"></i>
            <p id="messages"></p>
            <span class="close">&times;</span>
        </div>
    </div>

    <div class="container">
        <div class="image-section">
            <img src="{% static 'images/change.png' %}" alt="Forgot Password">
        </div>
        <div class="form-section">
            <h2>Forgot Password</h2>
            <form action="" method="POST" id="forgotPswForm">
                {% csrf_token %}
                <input type="password" id="password" name="password" placeholder="New Password">
                <input type="password" id="confirm_Password" name="confirm_password" placeholder="Confirm Password">
                <button type="submit">Change Password</button>
                <div class="change">
                    <p class="forgot">
                        <a href="{% url 'DP_login' %}">
                            <i class="fa fa-arrow-left" aria-hidden="true"></i> Back
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    


    <script>
        const forgotPswForm = document.getElementById("forgotPswForm");

        const modal = document.getElementById("psw");
        const span = document.querySelector(".close");
        const message = document.getElementById("messages");

        forgotPswForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const newPassword = document.getElementById("password");
            const confirmPassword = document.getElementById("confirm_Password");

            const regExPassword = /^(?=.*[A-Z])(?=.*[!@#$%^&*()_+{}\[\]:;"'<>,.?~-])[A-Za-z\d!@#$%^&*()_+{}\[\]:;"'<>,.?~-]{8,}$/;

            let valid = true;

            resetErrorMessages();

            if (newPassword.value === "") {
                valid = false;
                showModal("Password is required.");
            } else if (!regExPassword.test(newPassword.value)) {
                valid = false;
                showModal("Password must be at least 8 characters long and include at least one uppercase letter and one special character.");
            } else if (confirmPassword.value === "") {
                valid = false;
                showModal("Confirm password is required.");
            } else if (confirmPassword.value !== newPassword.value) {
                valid = false;
                showModal("Passwords do not match.");
            }

            if (valid) {
                const ForgotformData = new FormData(forgotPswForm); // Use the correct FormData object
                const token = "{{ token }}";
                const forgotUrl = `${window.location.origin}/Seller/Sreset_password/${token}/`;
                fetch(forgotUrl, {
                    method: 'POST',
                    body: ForgotformData, // Correct FormData object used here
                })
                    .then(response => response.url)
                    .then(url => {
                        const params = new URLSearchParams(url.split('?')[1]);
                        const error = params.get('error');
                        if (error) {
                            // document.getElementById('error-message').value = error;
                            showModal(error);
                            // Displaying alert message instead of error in the HTML
                            // alert(error); // This will show an alert with the error message
                        } else {
                            window.location.href = `${window.location.origin}/Seller/seller_login?success=psw_changed`;
                        }
                    });
            }
        });

        function resetErrorMessages() {
            const errorMsg = document.querySelectorAll(".error-message");
            errorMsg.forEach((error) => {
                error.textContent = "";
            });
        }

        span.onclick = function () {
            modal.style.display = "none";
        };

        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };

        function showModal(messageText) {
            message.textContent = messageText;
            modal.style.display = "block";

            setTimeout(() => {
                modal.style.display = "none";
            }, 5000);
        }

    </script>
</body>

</html>
